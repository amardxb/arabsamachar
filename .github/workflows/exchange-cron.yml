name: Save Exchange Rates

on:
  schedule:
    - cron: '0 2 * * *'   # UAE 6:00 AM
    - cron: '0 6 * * *'   # UAE 10:00 AM
    - cron: '0 10 * * *'  # UAE 2:00 PM
    - cron: '0 14 * * *'  # UAE 6:00 PM
    - cron: '0 18 * * *'  # UAE 10:00 PM
    - cron: '0 22 * * *'  # UAE 2:00 AM
  workflow_dispatch:

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Call API
        run: |
          curl --fail --silent --show-error \
          "${{ secrets.SITE_URL }}/api/cron/exchange-save" \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
